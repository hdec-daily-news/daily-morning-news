name: Daily Morning News Update

on:
  schedule:
    # 매일 21:03 UTC = 06:03 KST (전일 22:00~당일 06:00 필터가 끝난 직후 실행, 06:30 완성 목표로 27분 여유)
    - cron: '3 21 * * *'
  workflow_dispatch:
    inputs:
      now_override:
        description: '테스트용 실행 시각 override (ISO 8601, 예: 2026-07-09T06:05:00+09:00). 비워두면 실제 시각 사용.'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Collect links (project 1)
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NOW_OVERRIDE: ${{ github.event.inputs.now_override }}
        run: python collect_links.py

      - name: Collect newsstand politics (project 1, politics_main 대체)
        env:
          NOW_OVERRIDE: ${{ github.event.inputs.now_override }}
        run: python collect_newsstand.py

      - name: Build Excel (project 1)
        run: python build_excel.py

      - name: Capture screenshots (project 2)
        env:
          NOW_OVERRIDE: ${{ github.event.inputs.now_override }}
        run: python capture_images.py

      - name: Capture agency graphics (연합뉴스/뉴스1/뉴시스 그래픽 코너)
        env:
          NOW_OVERRIDE: ${{ github.event.inputs.now_override }}
        run: python capture_graphics.py

      - name: Build page
        run: python build_page.py

      - name: Assemble site (매일 생성되는 이미지/엑셀은 git에는 커밋하지 않고 배포 아티팩트로만 사용)
        run: |
          mkdir -p _site/output _site/images
          cp index.html style.css _site/
          cp output/latest.xlsx output/images.zip _site/output/
          cp -r images/. _site/images/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
